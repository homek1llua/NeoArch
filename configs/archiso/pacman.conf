#
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

# Optimizations
DownloadUser = root
DisableDownloadTimeout
CleanMethod = KeepCurrent

# Repositories
[core]
SigLevel = PackageRequired
Include = /etc/pacman.d/mirrorlist

[extra]
SigLevel = PackageRequired
Include = /etc/pacman.d/mirrorlist

[multilib]
SigLevel = PackageRequired
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
SigLevel = Optional TrustAll
Server = https://repo.chaoticaur.net/chaotic-aur/x86_64
