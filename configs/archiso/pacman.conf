#
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

# Optimizations
DownloadUser = root
DisableDownloadTimeout
CleanMethod = KeepCurrent

# Repositories
[core]
SigLevel = Optional TrustAll
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch

[extra]
SigLevel = Optional TrustAll
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch

[multilib]
SigLevel = Optional TrustAll
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch

# [chaotic-aur] disabled in CI; uncomment for local builds
# SigLevel = Optional TrustAll
# Server = https://repo.chaoticaur.net/chaotic-aur/x86_64
