#
# /etc/makepkg.conf - optimized for x86_64
#

CPPFLAGS="-D_FORTIFY_SOURCE=2"
CFLAGS="-march=x86-64-v3 -mtune=generic -O3 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection -fstack-protector-strong \
        -fno-omit-frame-pointer -falign-functions=32 \
        -flto=auto -fuse-linker-plugin"
CXXFLAGS="${CFLAGS} -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro \
         -Wl,-z,now -Wl,-z,pack-relative-relocs \
         -Wl,--hash-style=gnu -Wl,--gc-sections \
         -flto=auto"
LTOFLAGS="-flto=auto"
RUSTFLAGS="-C opt-level=3 -C target-cpu=x86-64-v3 -C link-arg=-zrelro -C link-arg=-znow"
MAKEFLAGS="-j$(nproc)"
BUILDENV=(!distcc color !ccache check !sign)
BUILDDIR=/tmp/makepkg
PKGDEST=/var/cache/pacman/pkg
SRCDEST=/var/cache/pacman/src
LOGDEST=/var/log/makepkg
INTEGRITY_CHECK=(sha256)
STRIP_BINARIES="--strip-all"
STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"
MAN_DIRS=({usr{,/local}{,/share},opt/*}/man)
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc} opt/*/{doc,gtk-doc})
PURGE_TARGETS=(usr/{,local/}{,share/}info)
COMPRESSGZ=(pigz -c -f -n)
COMPRESSBZ2=(pbzip2 -c -f)
COMPRESSXZ=(xz -c -z --threads=0 -)
COMPRESSZST=(zstd -c -z -q --threads=0 -)
COMPRESSLRZ=(lrzip -q -)
COMPRESSLZO=(lzop -q -)
COMPRESSZ=(compress -f)
PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.zst'
