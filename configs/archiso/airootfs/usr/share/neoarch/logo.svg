<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0520"/>
      <stop offset="100%" style="stop-color:#2D1B4E"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bg)" stroke="#7C3AED" stroke-width="2"/>

  <!-- Outer glow ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#glow)" stroke-width="15"/>

  <!-- Inner decorative ring -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="8,8" opacity="0.5"/>

  <!-- N letter - stylized -->
  <path d="M 100 380 L 100 120 L 130 120 L 250 300 L 250 120 L 280 120 L 280 380 L 250 380 L 130 200 L 130 380 Z"
        fill="url(#letter)" stroke="#C084FC" stroke-width="0.5"/>

  <!-- Decorative lines around N -->
  <line x1="80" y1="100" x2="300" y2="100" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="400" x2="300" y2="400" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>

  <!-- Small decorative diamonds -->
  <polygon points="320,120 330,130 320,140 310,130" fill="#A855F7" opacity="0.6"/>
  <polygon points="320,370 330,380 320,390 310,380" fill="#A855F7" opacity="0.6"/>

  <!-- Tagline -->
  <text x="250" y="440" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
        font-size="18" fill="#C084FC" letter-spacing="4" opacity="0.8">
    OPTIMIZED ARCH
  </text>
</svg>
