UI menu.c32
TIMEOUT 30
DEFAULT boot

MENU TITLE NeoArch Linux
MENU BACKGROUND splash.png

MENU COLOR border       30;44   #40A855F7 #00000000 none
MENU COLOR title        1;36;44 #00C084FC #00000000 none
MENU COLOR sel          7;37;44 #00FFFFFF #007C3AED none
MENU COLOR unsel        37;44   #00D8B4FE #00000000 none
MENU COLOR hotkey       1;37;44 #00A855F7 #00000000 none
MENU COLOR hotsel       1;7;37;44 #00FFFFFF #007C3AED none
MENU COLOR scrollbar    30;44   #00A855F7 #00000000 none
MENU COLOR tabmsg       31;44   #00C084FC #00000000 none
MENU COLOR cmdmark      1;36;44 #00E1B3FF #00000000 none
MENU COLOR cmdline      0;36;44 #00FFFFFF #00000000 none
MENU COLOR pwdborder    0;36;44 #00A855F7 #00000000 none
MENU COLOR pwdheader    0;36;44 #00E1B3FF #00000000 none
MENU COLOR pwdentry     0;36;44 #00FFFFFF #00000000 none
MENU COLOR timeout_msg  37;44   #00C084FC #00000000 none
MENU COLOR timeout      1;37;44 #00A855F7 #00000000 none
MENU COLOR disabled     1;30;44 #009CA3AF #00000000 none
MENU COLOR help         37;44   #00D8B4FE #00000000 none

LABEL boot
    MENU LABEL Boot NeoArch Linux
    LINUX ../%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 udev.log_priority=3 nowatchdog
    INITRD ../%INSTALL_DIR%/boot/x86_64/intel-ucode.img,../%INSTALL_DIR%/boot/x86_64/amd-ucode.img,../%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img

LABEL hwdetect
    MENU LABEL Boot NeoArch Linux (Hardware Detection)
    LINUX ../%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset
    INITRD ../%INSTALL_DIR%/boot/x86_64/intel-ucode.img,../%INSTALL_DIR%/boot/x86_64/amd-ucode.img,../%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img

LABEL copytoram
    MENU LABEL Boot NeoArch Linux (Copy to RAM)
    LINUX ../%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram quiet splash
    INITRD ../%INSTALL_DIR%/boot/x86_64/intel-ucode.img,../%INSTALL_DIR%/boot/x86_64/amd-ucode.img,../%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img

LABEL memtest
    MENU LABEL Run Memtest86+
    LINUX ../%INSTALL_DIR%/boot/memtest86+/memtest

LABEL hdd
    MENU LABEL Boot existing OS
    COM32 chain.c32
    APPEND hd0 1

LABEL shutdown
    MENU LABEL Shutdown
    COM32 poweroff.c32

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32
