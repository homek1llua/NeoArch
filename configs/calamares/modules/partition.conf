---
# Partitioning configuration for NeoArch
defaultPartitionTableType: gpt
defaultFileSystemType: btrfs

alwaysShowPartitionLabels: true
allowSuspend: false
drawNest: false
enableLuks: true
initialPartitioningChoice: erase
initialSwapChoice: file

optionsAfterPartitioning:
  - resizefs
  - setLink

partitionLayout:
  - name: root
    type: btrfs
    mountPoint: /
    filesystem: btrfs
    minSize: 20G
    percentage: 100
    features:
      - compress=zstd:3
      - noatime
      - ssd
    subvolumes:
      - name: @
        mountPoint: /
      - name: @home
        mountPoint: /home
      - name: @var
        mountPoint: /var
      - name: @tmp
        mountPoint: /tmp
      - name: @snapshots
        mountPoint: /.snapshots
      - name: @cache
        mountPoint: /var/cache
      - name: @log
        mountPoint: /var/log

  - name: efi
    type: fat32
    mountPoint: /efi
    filesystem: fat32
    minSize: 300M
    maxSize: 512M
    percentage: 0

efi:
  efiSystemPartition: /efi
  mountOptions: defaults,noatime

grub:
  installEFI: true
  installMBR: true
