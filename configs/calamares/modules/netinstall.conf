---
# Netinstall module for NeoArch
groupsUrl: /etc/calamares/modules/netinstall.yaml
required:
  - name: "base"
    description: "Base system"
    hidden: true
    selected: true
    subgroups:
      - name: "Base System"
        description: "Core operating system components"
        packages:
          - base
          - base-devel
          - linux
          - linux-headers
          - linux-firmware
        selected: true
        critical: true

  - name: "Desktop"
    description: "Desktop environment selection"
    hidden: false
    preselected: false
    subgroups:
      - name: "KDE Plasma (Recommended)"
        description: "Full KDE Plasma desktop environment"
        packages:
          - plasma-meta
          - plasma-wayland-session
          - kde-applications-meta
          - sddm
          - dolphin
          - konsole
          - kate
        selected: true

      - name: "GNOME Desktop"
        description: "GNOME desktop environment"
        packages:
          - gnome
          - gnome-extra
          - gdm
        selected: false

      - name: "Minimal XFCE"
        description: "Lightweight XFCE desktop"
        packages:
          - xfce4
          - xfce4-goodies
          - lightdm
          - lightdm-gtk-greeter
        selected: false

  - name: "Drivers"
    description: "Graphics drivers"
    preset: true
    subgroups:
      - name: "AMD/ATI (open source)"
        description: "Mesa drivers for AMD GPUs"
        packages:
          - mesa
          - mesa-utils
          - vulkan-radeon
          - libva-mesa-driver
          - xf86-video-amdgpu
        selected: false

      - name: "Intel (open source)"
        description: "Drivers for Intel GPUs"
        packages:
          - mesa
          - mesa-utils
          - vulkan-intel
          - libva-intel-driver
          - intel-media-driver
        selected: false

      - name: "NVIDIA (proprietary)"
        description: "NVIDIA proprietary drivers"
        packages:
          - nvidia-dkms
          - nvidia-utils
          - nvidia-settings
          - vulkan-headers
          - libva-nvidia-driver-git
        selected: false

  - name: "Software"
    description: "Additional software selection"
    preset: false
    subgroups:
      - name: "Web Browsers"
        description: "Web browsers"
        packages:
          - firefox
          - firefox-i18n-en-us
          - chromium
        selected: true

      - name: "Development Tools"
        description: "Development tools and IDEs"
        packages:
          - git
          - vim
          - code
          - python
          - python-pip
          - nodejs
          - npm
          - docker
          - docker-compose
        selected: true

      - name: "Multimedia"
        description: "Multimedia codecs and players"
        packages:
          - vlc
          - gstreamer
          - gst-plugins-good
          - gst-plugins-bad
          - gst-plugins-ugly
          - gst-libav
          - ffmpeg
          - pipewire
          - pipewire-alsa
          - pipewire-jack
          - pipewire-pulse
          - wireplumber
        selected: true

      - name: "Gaming"
        description: "Gaming packages and tools"
        packages:
          - steam
          - lutris
          - wine
          - winetricks
          - gamemode
          - mangohud
          - proton-ge-custom-bin
        selected: false

  - name: "Optimizations"
    description: "Performance optimizations"
    preset: true
    subgroups:
      - name: "Performance Tweaks"
        description: "System performance optimizations"
        packages:
          - irqbalance
          - preload
          - profile-sync-daemon
          - haveged
          - zram-generator
        selected: true
        critical: false

      - name: "Gaming Optimizations"
        description: "Gaming-focused optimizations"
        packages:
          - gamemode
          - mangohud
          - libstrangle
        selected: false
