name: Build NeoArch ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO in Arch Linux VM
        uses: vmactions/vm-action@v1
        with:
          image: archlinux/archlinux:base
          shell: bash
          prepare: |
            pacman -Sy --noconfirm --needed archiso base-devel git python python-pillow squashfs-tools xorriso dosfstools mtools
          run: |
            cd /build/neoarch
            chmod +x build.sh
            ./build.sh
          volumes: |
            ${{ github.workspace }}:/build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: neoarch-iso
          path: neoarch/out/*.iso
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: neoarch/out/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
